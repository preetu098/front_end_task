<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .super 
        {
            height: 300px;
            width: 500px;
            background-color: red;
            position: relative;
        }
        .sub 
        {
            height: 100px;
            width: 200px;
            background-color: orange;
            margin-top: 100px;
            position: absolute;
            margin-left: 200px;
        
        }
    </style>
</head>
<body>
<!-- open super div  -->
    <div class="super">
        <!-- open sub div  -->
            <div class="sub">

            </div>
        <!-- close sub div  -->
    </div>
    <!-- close super div  -->
</body>
</html>
